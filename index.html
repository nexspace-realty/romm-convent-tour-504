<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Romm Convent · Type C6 · Nexspace Realty</title>
<meta name="description" content="360° virtual tour – Romm Convent, Type C6, 2BR 2BA, 96.95 sqm, Floor 19">
<!-- Share preview (LINE / Facebook) -->
<meta property="og:title" content="Nexspace Realty Exclusive at Romm Convent">
<meta property="og:description" content="Type C6 · 96.95 sqm · 2BR, 2BA · Floor 19 — 360° virtual tour">
<meta property="og:image" content="images/01-living-room.jpg">

<link rel="stylesheet" href="vendor/pannellum.css">
<script src="vendor/pannellum.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">

<style>
  /* Avenir Next on Apple devices (the font in your example), Nunito Sans everywhere else */
  :root { --font: "Avenir Next", "Avenir", "Nunito Sans", system-ui, sans-serif; }
  html, body { margin: 0; height: 100%; background: #111; overflow: hidden; font-family: var(--font); }
  #pano { position: fixed; inset: 0; }

  /* ---------- Unit info, top-left ---------- */
  .info {
    position: fixed; top: 14px; left: 16px; z-index: 5; color: #fff; pointer-events: none;
    text-shadow: 0 1px 4px rgba(0,0,0,.55);
  }
  .info h1 { margin: 0 0 6px; font-size: clamp(16px, 2.2vw, 24px); font-weight: 700; }
  .info p  { margin: 2px 0; font-size: clamp(12px, 1.3vw, 15px); font-weight: 500; opacity: .95; }

  /* ---------- Fullscreen button, top-right ---------- */
  .fs {
    position: fixed; top: 12px; right: 12px; z-index: 5; width: 40px; height: 40px;
    border: 0; border-radius: 6px; background: rgba(255,255,255,.85); cursor: pointer;
    display: grid; place-items: center;
  }
  .fs svg { width: 22px; height: 22px; }

  /* ---------- Room buttons, bottom ---------- */
  .rooms {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 5;
    display: flex; gap: 10px; overflow-x: auto; scrollbar-width: none;
    padding: 12px 16px calc(14px + env(safe-area-inset-bottom));
    background: linear-gradient(transparent, rgba(0,0,0,.45));
  }
  .rooms::-webkit-scrollbar { display: none; }
  .rooms button {
    flex: 0 0 auto; font-family: var(--font); font-size: 15px; font-weight: 600;
    padding: 10px 18px; border-radius: 999px; cursor: pointer; white-space: nowrap;
    color: #fff; background: rgba(40,40,40,.82); border: 1px solid rgba(255,255,255,.12);
    transition: background .15s, color .15s;
  }
  .rooms button:hover { background: rgba(70,70,70,.9); }
  .rooms button.active { background: #fff; color: #111; font-weight: 700; }

  /* ---------- Floor badge that covers the tripod ---------- */
  .badge {
    width: 0; height: 0; /* hotspot anchor; the label is centred on it */
  }
  .badge > * {
    position: absolute; transform: translate(-50%, -50%);
    display: block; text-align: center; white-space: nowrap; text-decoration: none;
    font-family: var(--font); font-weight: 700; font-size: 17px; line-height: 1.35; color: #1b2230;
    background: rgba(255,255,255,.95); padding: 10px 22px; border-radius: 18px;
    box-shadow: 0 2px 10px rgba(0,0,0,.25);
  }

  /* hide Pannellum's own controls & credits — we use our own UI */
  .pnlm-controls-container, .pnlm-about-msg { display: none !important; }
  .pnlm-load-box { font-family: var(--font); }

  @media (max-width: 600px) {
    .rooms button { font-size: 13px; padding: 8px 14px; }
    .badge > * { font-size: 14px; padding: 8px 16px; }
  }
</style>
</head>
<body>

<div id="pano"></div>

<div class="info">
  <h1 id="title"></h1>
  <div id="details"></div>
</div>

<button class="fs" id="fsBtn" aria-label="Fullscreen">
  <svg viewBox="0 0 24 24" fill="none" stroke="#222" stroke-width="2.2"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>
</button>

<nav class="rooms" id="rooms"></nav>

<script>
/* =====================================================================
   EDIT EVERYTHING IN THIS BLOCK — that's all you need to change
   for a new unit. Copy the whole folder, swap images, edit below.
   ===================================================================== */
const UNIT = {
  title:   "Nexspace Realty Exclusive at Romm Convent",
  details: ["Type C6 · 96.95 sqm", "2BR, 2BA", "Floor 19"],
};

const CONTACT = {
  line1: "Nexspace Realty",
  line2: "LINE ID: @nexspace",
  link:  "https://line.me/R/ti/p/@nexspace",   // tap the badge to add you on LINE ("" = not clickable)
};

// Order here = order of the buttons. First one opens first.
// yaw = which direction the view starts facing (degrees, -180 to 180).
const ROOMS = [
  { id: "living",    label: "Living room",     image: "images/01-living-room.jpg",     yaw: 0 },
  { id: "balcony",   label: "Balcony",         image: "images/02-balcony.jpg",         yaw: 0 },
  { id: "hallway",   label: "Hallway",         image: "images/03-hallway.jpg",         yaw: 0 },
  { id: "bed2",      label: "Bedroom 2",       image: "images/04-bedroom-2.jpg",       yaw: 0 },
  { id: "bath2",     label: "Bathroom 2",      image: "images/05-bathroom-2.jpg",      yaw: 0 },
  { id: "master",    label: "Master bedroom",  image: "images/06-master-bedroom.jpg",  yaw: 0 },
  { id: "masterbath",label: "Master bathroom", image: "images/07-master-bathroom.jpg", yaw: 0 },
  { id: "closet",    label: "Built-in closet", image: "images/08-built-in-closet.jpg", yaw: 0 },
  { id: "view",      label: "Open view",       image: "images/09-open-view.jpg",       yaw: 0 },
  { id: "dining",    label: "Dining",          image: "images/10-dining.jpg",          yaw: 0 },
];
/* ===================================================================== */

// Unit info
document.getElementById("title").textContent = UNIT.title;
document.getElementById("details").innerHTML = UNIT.details.map(t => `<p>${t}</p>`).join("");

// Floor badge (sits straight down, over the tripod)
function makeBadge(div) {
  div.classList.add("badge");
  const a = document.createElement(CONTACT.link ? "a" : "span");
  if (CONTACT.link) { a.href = CONTACT.link; a.target = "_blank"; a.rel = "noopener"; }
  a.innerHTML = `${CONTACT.line1}<br>${CONTACT.line2}`;
  // keep it a real link (Pannellum would otherwise treat the tap as a drag)
  a.addEventListener("mousedown", e => e.stopPropagation());
  a.addEventListener("touchstart", e => e.stopPropagation());
  div.appendChild(a);
}

// Build scenes
const scenes = {};
ROOMS.forEach(r => {
  scenes[r.id] = {
    type: "equirectangular",
    panorama: r.image,
    yaw: r.yaw, pitch: 0, hfov: 100,
    hotSpots: [{ pitch: -90, yaw: 0, cssClass: "badge", createTooltipFunc: makeBadge }],
  };
});

const viewer = pannellum.viewer("pano", {
  default: { firstScene: ROOMS[0].id, autoLoad: true, sceneFadeDuration: 600, minHfov: 50, maxHfov: 120 },
  scenes,
  showControls: false,
  compass: false,
});

// Room buttons
const nav = document.getElementById("rooms");
ROOMS.forEach(r => {
  const b = document.createElement("button");
  b.textContent = r.label;
  b.dataset.id = r.id;
  b.onclick = () => viewer.loadScene(r.id);
  nav.appendChild(b);
});
function setActive(id) {
  nav.querySelectorAll("button").forEach(b => {
    const on = b.dataset.id === id;
    b.classList.toggle("active", on);
    if (on) b.scrollIntoView({ behavior: "smooth", inline: "center", block: "nearest" });
  });
}
setActive(ROOMS[0].id);
viewer.on("scenechange", setActive);

// Fullscreen
document.getElementById("fsBtn").onclick = () => {
  const d = document, el = d.documentElement;
  if (d.fullscreenElement || d.webkitFullscreenElement) (d.exitFullscreen || d.webkitExitFullscreen).call(d);
  else if (el.requestFullscreen || el.webkitRequestFullscreen) (el.requestFullscreen || el.webkitRequestFullscreen).call(el);
};
// iPhone Safari has no fullscreen API for pages — hide the button there
if (!document.documentElement.requestFullscreen && !document.documentElement.webkitRequestFullscreen)
  document.getElementById("fsBtn").style.display = "none";
</script>
</body>
</html>
