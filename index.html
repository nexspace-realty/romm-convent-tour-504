<style>

sition:absolute;-webkit-transform-origin:0 0;transform-origin:0 0}.pnlm-dragfix,.pnlm-preview-img{position:absolute;height:100%;width:100%}.pnlm-preview-img{background-size:cover;background-position:center}.pnlm-fade-img{position:absolute;top:0;left:0}.pnlm-pointer{cursor:pointer}

/* ---- Page design ----
   Layout: full-bleed panorama with no chrome — just the identification
   caption (top-left, set directly on the image) and a floating pill bar
   of room names (bottom-center). Matches the house tour template:
   one neutral sans throughout, nothing boxed or carded. */
:root{
  --fg:#ffffff;
  --muted:rgba(255,255,255,.82);
  --pill-bg:rgba(20,20,22,.55);
  --pill-bg-hover:rgba(20,20,22,.72);
  --pill-active-bg:#ffffff;
  --pill-active-fg:#15161a;
  --shadow-text:0 1px 3px rgba(0,0,0,.65), 0 1px 14px rgba(0,0,0,.35);
  color-scheme:dark;
}

*{box-sizing:border-box}
html,body{height:100%}
body{
  background:#0c0c0d;
  color:var(--fg);
  font-family:'Inter',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
  padding-inline:0;
  overflow:hidden;
}

.stage{
  position:relative;
  width:100%;
  height:100vh;
  height:100dvh;
  background:#000;
}
#pano{position:absolute;inset:0}

/* identification caption */
.caption{
  position:absolute;
  top:calc(20px + env(safe-area-inset-top,0px));
  left:24px;
  right:24px;
  z-index:4;
  pointer-events:none;
  text-shadow:var(--shadow-text);
}
.caption h1{
  margin:0 0 6px;
  font-size:clamp(17px,2.1vw,22px);
  font-weight:700;
  letter-spacing:-.01em;
}
.caption p{
  margin:0;
  font-size:14px;
  line-height:1.55;
  font-weight:500;
  color:var(--muted);
}

/* pill room nav */
.nav-wrap{
  position:absolute;
  left:0;
  right:0;
  bottom:calc(22px + env(safe-area-inset-bottom,0px));
  z-index:4;
  display:flex;
  justify-content:center;
  padding:0 16px;
}
.nav{
  display:flex;
  gap:8px;
  overflow-x:auto;
  max-width:100%;
  padding:4px 2px;
  scrollbar-width:none;
}
.nav::-webkit-scrollbar{display:none}
.pill{
  flex:0 0 auto;
  appearance:none;
  border:none;
  cursor:pointer;
  font-family:inherit;
  font-size:14px;
  font-weight:600;
  letter-spacing:-.005em;
  color:var(--fg);
  background:var(--pill-bg);
  backdrop-filter:blur(10px);
  -webkit-backdrop-filter:blur(10px);
  padding:11px 20px;
  border-radius:999px;
  transition:background .15s ease, color .15s ease, transform .1s ease;
  white-space:nowrap;
}
.pill:hover{background:var(--pill-bg-hover)}
.pill:active{transform:scale(.97)}
.pill.active{background:var(--pill-active-bg);color:var(--pill-active-fg)}
.pill:focus-visible{outline:2px solid #fff;outline-offset:2px}

.hint{
  position:absolute;
  left:50%;
  bottom:calc(84px + env(safe-area-inset-bottom,0px));
  transform:translateX(-50%);
  font-size:12.5px;
  font-weight:500;
  color:var(--muted);
  pointer-events:none;
  text-shadow:var(--shadow-text);
  transition:opacity .6s ease;
  white-space:nowrap;
  z-index:4;
}
.hint[hidden]{display:none}

.stage-fade{
  position:absolute;inset:0;background:#0c0c0d;
  display:flex;align-items:center;justify-content:center;
  transition:opacity .35s ease;
  pointer-events:none;
  opacity:0;
  z-index:3;
}
.stage-fade.show{opacity:1;pointer-events:auto}
.spin{
  width:26px;height:26px;border-radius:50%;
  border:2px solid rgba(255,255,255,.2);
  border-top-color:#fff;
  animation:spin .8s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}

@media (max-width:560px){
  .caption{left:16px;right:16px;top:calc(14px + env(safe-area-inset-top,0px))}
  .caption p{font-size:12.5px}
  .pill{padding:9px 15px;font-size:13px}
  .nav-wrap{bottom:calc(14px + env(safe-area-inset-bottom,0px))}
}
</style>

<div class="stage">
  <div id="pano"></div>

  <div class="caption">
    <h1>Nexspace Realty Exclusive at Romm Convent</h1>
    <p>Type C11 &middot; 117 sq.m.<br>2BR Plus, 2BA<br>Floor 5</p>
  </div>

  <div class="hint" id="hint">Drag to look around &nbsp;&middot;&nbsp; scroll to zoom</div>

  <div class="nav-wrap">
    <nav class="nav" id="nav" aria-label="Rooms"></nav>
  </div>

  <div class="stage-fade" id="stageFade"><div class="spin"></div></div>
</div>

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/pannellum/2.5.6/pannellum.js"></script>
<script>
(function(){
  var rooms = [
    { slug:"entrance",        file:"01-entrance.jpg",       name:"Entrance" },
    { slug:"living-room",     file:"02-living-room.jpg",    name:"Living room" },
    { slug:"powder-room",     file:"03-powder-room.jpg",    name:"Powder room" },
    { slug:"hallway",         file:"04-hallway.jpg",        name:"Hallway" },
    { slug:"guest-bathroom",  file:"05-guest-bathroom.jpg", name:"Guest bathroom" },
    { slug:"master-hall",     file:"06-master-hall.jpg",    name:"Master hall" },
    { slug:"master-bathroom", file:"07-master-bathroom.jpg",name:"Master bathroom" },
    { slug:"master-bedroom",  file:"08-master-bedroom.jpg", name:"Master bedroom" },
    { slug:"bedroom-2",       file:"09-bedroom-view.jpg",   name:"Bedroom 2" },
    { slug:"kitchen-dining",  file:"10-kitchen-dining.jpg", name:"Kitchen" }
  ];

  var scenes = {};
  rooms.forEach(function(r){
    scenes[r.slug] = {
      type:"equirectangular",
      panorama:r.file,
      title:r.name,
      hfov:112,
      minHfov:50,
      maxHfov:120,
      pitch:2,
      yaw:0,
      autoLoad:true
    };
  });

  var startSlug = (location.hash || "").replace("#","");
  if (!rooms.some(function(r){ return r.slug === startSlug; })) {
    startSlug = rooms[0].slug;
  }

  var viewer = pannellum.viewer('pano', {
    default:{
      firstScene:startSlug,
      sceneFadeDuration:650,
      autoLoad:true,
      showZoomCtrl:false,
      showFullscreenCtrl:false,
      showControls:false,
      compass:false,
      hotSpotDebug:false
    },
    scenes:scenes
  });

  var navEl = document.getElementById('nav');
  var fadeEl = document.getElementById('stageFade');
  var hintEl = document.getElementById('hint');

  rooms.forEach(function(r){
    var btn = document.createElement('button');
    btn.type = "button";
    btn.className = "pill" + (r.slug === startSlug ? " active" : "");
    btn.textContent = r.name;
    btn.dataset.slug = r.slug;
    btn.addEventListener('click', function(){ goTo(r.slug); });
    navEl.appendChild(btn);
  });

  function goTo(slug){
    if (slug === viewer.getScene()) return;
    fadeEl.classList.add('show');
    viewer.loadScene(slug);
    history.replaceState(null, "", "#" + slug);
  }

  function syncUI(slug){
    Array.prototype.forEach.call(navEl.children, function(el){
      el.classList.toggle('active', el.dataset.slug === slug);
    });
    var active = navEl.querySelector('.pill.active');
    if (active && active.scrollIntoView) {
      active.scrollIntoView({ behavior:'smooth', inline:'center', block:'nearest' });
    }
  }

  viewer.on('scenechange', function(slug){
    syncUI(slug);
    fadeEl.classList.remove('show');
  });

  syncUI(startSlug);

  window.addEventListener('hashchange', function(){
    var slug = (location.hash || "").replace("#","");
    if (rooms.some(function(r){ return r.slug === slug; })) goTo(slug);
  });

  var dismissed = false;
  function dismissHint(){
    if (dismissed) return;
    dismissed = true;
    hintEl.style.opacity = '0';
    setTimeout(function(){ hintEl.hidden = true; }, 650);
  }
  document.getElementById('pano').addEventListener('pointerdown', dismissHint, { once:true });
  setTimeout(dismissHint, 6000);
})();
</script>
